# One-time setup:  pip install pre-commit && pre-commit install
# Run on everything:  pre-commit run --all-files
exclude: ^(LICENSE|third_party/|pnpm-lock\.yaml$|workloads/build/|m5out/)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]

  # Python: black formats, ruff lints (ruff's own formatter is not used).
  # Order matters: ruff --fix first, black last so black has the final word.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.10.0
    hooks:
      - id: black

  # C/C++
  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v23.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: python
        additional_dependencies: ["clang-tidy==22.1.8"]
        files: ^workloads/.*\.(cpp|cc|c)$
        # No compile_commands.json for this tiny Makefile, so pass flags via --extra-arg
        # (pre-commit appends filenames last, so a bare "--" separator would break).
        # USE_M5 is left off: it needs gem5's m5ops.h from the submodule.
        args: [--quiet, --extra-arg=-std=c++17, --extra-arg=-O2]
